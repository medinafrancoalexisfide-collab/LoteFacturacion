version: 2
updates:
  # Paquetes NuGet (proyecto principal y de pruebas)
  - package-ecosystem: "nuget"
    directories:
      - "/src/FacturacionLote"
      - "/tests/FacturacionLote.Tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Versiones de las acciones usadas en .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
