name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # todos los lunes

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # revisa todo el historial, no solo el último commit

      # Nota: en repositorios personales no hace falta licencia. En una organización de GitHub
      # esta acción requiere una GITLEAKS_LICENSE (ver la documentación de gitleaks-action).
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
