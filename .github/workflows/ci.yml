name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar paquetes
        run: dotnet restore FacturacionLote.slnx

      - name: Compilar
        run: dotnet build FacturacionLote.slnx -c Release --no-restore

      - name: Pruebas
        run: dotnet test FacturacionLote.slnx -c Release --no-build --verbosity normal

      # Falla si algún paquete (directo o transitivo) tiene una vulnerabilidad conocida.
      - name: Auditar paquetes vulnerables
        shell: pwsh
        run: |
          $salida = dotnet list FacturacionLote.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $salida
          if ($salida -match "has the following vulnerable packages") {
            throw "Hay paquetes con vulnerabilidades conocidas. Revisá el detalle de arriba."
          }
